name: Daily AJet intelligence

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC / 08:00 Europe/Istanbul
  workflow_dispatch:
    inputs:
      operation:
        description: "Publish, preview, inspect, or reconcile a previous ambiguous delivery"
        type: choice
        default: dry-run
        options:
          - dry-run
          - publish
          - outbox-status
          - mark-sent
          - retry-message
      outbox_id:
        description: "Full outbox ID (required only for mark-sent / retry-message)"
        type: string
        required: false

permissions:
  contents: read

# Serialize all runs, including manual previews and maintenance, against the same state.
concurrency:
  group: flynews-production
  cancel-in-progress: false

jobs:
  digest:
    # Production and state maintenance use only the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_PATH: data/news.db
      DRY_RUN: "false"
      PYTHONUNBUFFERED: "1"
      OPERATION: ${{ inputs.operation || 'publish' }}
      OUTBOX_ID: ${{ inputs.outbox_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Restore latest SQLite state
        id: state
        uses: actions/cache/restore@v6
        with:
          path: data/news.db
          key: flynews-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flynews-state-v1-
      - name: Note missing persistent state
        if: steps.state.outputs.cache-matched-key == ''
        run: echo '::warning::No saved state found. This may be the first run or cache eviction. Cross-run duplicate protection needs retained state.'
      - name: Run digest or maintenance
        id: run
        shell: bash
        run: |
          mkdir -p data
          case "$OPERATION" in
            publish) python -m src.main ;;
            dry-run) python -m src.main --dry-run 2>&1 | tee data/digest-preview.txt ;;
            outbox-status) python -m src.main --outbox-status ;;
            mark-sent) python -m src.main --resolve-message "$OUTBOX_ID" --resolution sent ;;
            retry-message) python -m src.main --resolve-message "$OUTBOX_ID" --resolution retry ;;
            *) exit 2 ;;
          esac
      - name: Show dry-run output in Summary
        id: report
        if: always() && env.OPERATION == 'dry-run' && steps.run.outcome != 'skipped'
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: python scripts/write_preview_report.py
      - name: Save downloadable dry-run output
        if: always() && env.OPERATION == 'dry-run' && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: digest-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/digest-preview.txt
          if-no-files-found: ignore
          retention-days: 7
      # Immutable per-run key: save even when publishing fails after a partial digest.
      - name: Persist SQLite state
        if: always() && steps.state.outcome == 'success' && env.OPERATION != 'dry-run'
        uses: actions/cache/save@v6
        with:
          path: data/news.db
          key: flynews-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep recovery snapshot
        if: always() && steps.state.outcome == 'success' && env.OPERATION != 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: flynews-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/news.db
          if-no-files-found: ignore
          retention-days: 30
